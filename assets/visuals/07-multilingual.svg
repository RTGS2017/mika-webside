<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img">
  <title>Multilingual consistency demo</title>
  <rect width="960" height="640" rx="28" fill="#F5F7FB"/>
  <rect x="24" y="24" width="912" height="592" rx="20" fill="#fff" stroke="#E6EAF2"/>
  <text x="828" y="52" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="12" letter-spacing="1.2">DEMO DATA</text>
  
    <text x="56" y="86" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="24" font-weight="720">多语言一致性</text>
    <text x="56" y="116" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">同一事实在各语言页面上的对照 · 示例</text>
    
      <rect x="56" y="146" width="124" height="40" rx="20" fill="#2F6FED" stroke="#E6EAF2"/>
      <text x="74" y="172" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14">中文</text>
    
      <rect x="196" y="146" width="124" height="40" rx="20" fill="#fff" stroke="#E6EAF2"/>
      <text x="214" y="172" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">English</text>
    
      <rect x="336" y="146" width="124" height="40" rx="20" fill="#fff" stroke="#E6EAF2"/>
      <text x="354" y="172" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">日本語</text>
    
      <rect x="476" y="146" width="124" height="40" rx="20" fill="#fff" stroke="#E6EAF2"/>
      <text x="494" y="172" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Español</text>
    
      <rect x="616" y="146" width="124" height="40" rx="20" fill="#fff" stroke="#E6EAF2"/>
      <text x="634" y="172" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">العربية</text>
    
      <rect x="756" y="146" width="124" height="40" rx="20" fill="#fff" stroke="#E6EAF2"/>
      <text x="774" y="172" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Deutsch</text>
    
    
      <text x="56" y="250" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">公司名</text>
      <rect x="160" y="228" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="400" y="228" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="640" y="228" width="220" height="40" rx="10" fill="#F5F7FB" stroke="none"/>
      <text x="176" y="254" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">示例公司</text>
      <text x="416" y="254" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Example Co.</text>
      <text x="656" y="254" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">示例会社</text>
    
      <text x="56" y="308" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">产品名</text>
      <rect x="160" y="286" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="400" y="286" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="640" y="286" width="220" height="40" rx="10" fill="#F5F7FB" stroke="none"/>
      <text x="176" y="312" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">示例产品</text>
      <text x="416" y="312" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Example product</text>
      <text x="656" y="312" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">サンプル</text>
    
      <text x="56" y="366" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">规格</text>
      <rect x="160" y="344" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="400" y="344" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="640" y="344" width="220" height="40" rx="10" fill="#F5F7FB" stroke="none"/>
      <text x="176" y="370" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">规格 A</text>
      <text x="416" y="370" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Spec A</text>
      <text x="656" y="370" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">仕様 A</text>
    
      <text x="56" y="424" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">应用</text>
      <rect x="160" y="402" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="400" y="402" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="640" y="402" width="220" height="40" rx="10" fill="#F5F7FB" stroke="none"/>
      <text x="176" y="428" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">场景 A</text>
      <text x="416" y="428" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">Use A</text>
      <text x="656" y="428" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">用途 A</text>
    
      <text x="56" y="482" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">主张</text>
      <rect x="160" y="460" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="400" y="460" width="220" height="40" rx="10" fill="#F5F7FB"/>
      <rect x="640" y="460" width="220" height="40" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
      <text x="176" y="486" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">一致</text>
      <text x="416" y="486" fill="#0B1220" font-family="Segoe UI, sans-serif" font-size="14">一致</text>
      <text x="656" y="486" fill="#7C3AED" font-family="Segoe UI, sans-serif" font-size="14">待核对</text>
    
  
</svg>
